<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" font-style="normal" font-family="'Rethink Sans','DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><title>The color pipeline, from a spectrum to stored numbers and back to light</title><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F2F2F2"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ABABAB"/></marker></defs><rect width="960" height="610" fill="#181818"/><text x="40" y="56" fill="#F2F2F2" font-size="24" font-weight="700">From light to numbers, and back to light</text><text x="40" y="92" fill="#ABABAB" font-size="16">Solid arrows carry the color along. Dashed arrows lead to values computed from it.</text><rect x="55" y="150" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="150" y="188" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Spectrum</text><text x="150" y="211" fill="#ABABAB" font-size="14" text-anchor="middle">power at each</text><text x="150" y="230" fill="#ABABAB" font-size="14" text-anchor="middle">wavelength</text><rect x="275" y="150" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="370" y="188" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Cone responses</text><text x="370" y="211" fill="#ABABAB" font-size="14" text-anchor="middle">three signals:</text><text x="370" y="230" fill="#ABABAB" font-size="14" text-anchor="middle">L, M, S</text><rect x="495" y="150" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="590" y="188" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">CIE XYZ</text><text x="590" y="211" fill="#ABABAB" font-size="14" text-anchor="middle">a standard form of</text><text x="590" y="230" fill="#ABABAB" font-size="14" text-anchor="middle">those responses</text><rect x="55" y="310" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="150" y="348" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Linear RGB</text><text x="150" y="371" fill="#ABABAB" font-size="14" text-anchor="middle">amounts of three</text><text x="150" y="390" fill="#ABABAB" font-size="14" text-anchor="middle">primaries</text><rect x="275" y="310" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="370" y="348" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Encoded RGB</text><text x="370" y="371" fill="#ABABAB" font-size="14" text-anchor="middle">after the transfer</text><text x="370" y="390" fill="#ABABAB" font-size="14" text-anchor="middle">function</text><rect x="495" y="310" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="590" y="348" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Stored value</text><text x="590" y="371" fill="#ABABAB" font-size="14" text-anchor="middle">#1A2B3C</text><text x="590" y="390" fill="#ABABAB" font-size="14" text-anchor="middle">26, 43, 60</text><rect x="715" y="310" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="810" y="357.5" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Models for people</text><text x="810" y="380.5" fill="#ABABAB" font-size="14" text-anchor="middle">HSL, HSB, OKLCH</text><rect x="55" y="470" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="150" y="508" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Decisions</text><text x="150" y="531" fill="#ABABAB" font-size="14" text-anchor="middle">luminance and</text><text x="150" y="550" fill="#ABABAB" font-size="14" text-anchor="middle">contrast</text><rect x="495" y="470" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="590" y="508" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">Display</text><text x="590" y="531" fill="#ABABAB" font-size="14" text-anchor="middle">decodes and drives</text><text x="590" y="550" fill="#ABABAB" font-size="14" text-anchor="middle">subpixels</text><rect x="715" y="470" width="190" height="104" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="810" y="508" fill="#F2F2F2" font-size="17" font-weight="700" text-anchor="middle">A new spectrum</text><text x="810" y="531" fill="#ABABAB" font-size="14" text-anchor="middle">different, but it</text><text x="810" y="550" fill="#ABABAB" font-size="14" text-anchor="middle">matches for the eye</text><path d="M245 202H274" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M465 202H494" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M590 254V282H150V309" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M245 362H274" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M465 362H494" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M685 362H714" fill="none" stroke="#ABABAB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><path d="M150 414V469" fill="none" stroke="#ABABAB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><path d="M590 414V469" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M685 522H714" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/></svg>