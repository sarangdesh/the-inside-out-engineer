<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-style="normal" font-family="'Rethink Sans','DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><title>One color's journey, from light to numbers and back to light</title><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F2F2F2"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ABABAB"/></marker></defs><rect width="960" height="640" fill="#181818"/><text x="40" y="56" fill="#F2F2F2" font-size="24" font-weight="700">One color's journey, from light to numbers and back</text><text x="40" y="90" fill="#ABABAB" font-size="16">Follow steps 1 to 8 with #1A2B3C. Each box says what happens, then gives its technical name.</text><text x="40" y="112" fill="#ABABAB" font-size="16">Dashed boxes are questions we ask of the color along the way.</text><rect x="52" y="152" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="149.5" y="198.5" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">Light leaves a source</text><text x="149.5" y="226.5" fill="#ABABAB" font-size="13.5" text-anchor="middle">a spectrum: power at</text><text x="149.5" y="244.5" fill="#ABABAB" font-size="13.5" text-anchor="middle">every wavelength</text><circle cx="54" cy="154" r="12" fill="#F2F2F2"/><text x="54" y="159" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">1</text><rect x="272" y="152" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="369.5" y="188" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">The eye keeps only</text><text x="369.5" y="209" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">three signals</text><text x="369.5" y="237" fill="#ABABAB" font-size="13.5" text-anchor="middle">L, M, and S cone</text><text x="369.5" y="255" fill="#ABABAB" font-size="13.5" text-anchor="middle">responses</text><circle cx="274" cy="154" r="12" fill="#F2F2F2"/><text x="274" y="159" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">2</text><rect x="492" y="152" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="589.5" y="188" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">We standardize</text><text x="589.5" y="209" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">those signals</text><text x="589.5" y="237" fill="#ABABAB" font-size="13.5" text-anchor="middle">CIE XYZ, for one</text><text x="589.5" y="255" fill="#ABABAB" font-size="13.5" text-anchor="middle">agreed observer</text><circle cx="494" cy="154" r="12" fill="#F2F2F2"/><text x="494" y="159" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">3</text><rect x="52" y="310" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="149.5" y="346" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">A screen needs amounts</text><text x="149.5" y="367" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">of three lights</text><text x="149.5" y="395" fill="#ABABAB" font-size="13.5" text-anchor="middle">linear RGB:</text><text x="149.5" y="413" fill="#ABABAB" font-size="13.5" text-anchor="middle">0.010, 0.024, 0.045</text><circle cx="54" cy="312" r="12" fill="#F2F2F2"/><text x="54" y="317" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">4</text><rect x="272" y="310" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="369.5" y="356.5" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">Bent to suit vision</text><text x="369.5" y="384.5" fill="#ABABAB" font-size="13.5" text-anchor="middle">encoded RGB:</text><text x="369.5" y="402.5" fill="#ABABAB" font-size="13.5" text-anchor="middle">0.102, 0.169, 0.235</text><circle cx="274" cy="312" r="12" fill="#F2F2F2"/><text x="274" y="317" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">5</text><rect x="492" y="310" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="589.5" y="346" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">Rounded and</text><text x="589.5" y="367" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">written down</text><text x="589.5" y="395" fill="#ABABAB" font-size="13.5" text-anchor="middle">stored value: #1A2B3C</text><text x="589.5" y="413" fill="#ABABAB" font-size="13.5" text-anchor="middle">26, 43, 60</text><circle cx="494" cy="312" r="12" fill="#F2F2F2"/><text x="494" y="317" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">6</text><rect x="712" y="310" width="195" height="128" rx="8" fill="#262626" stroke="#ABABAB" stroke-dasharray="6 5"/><text x="809.5" y="355" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">How do people</text><text x="809.5" y="376" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">talk about it?</text><text x="809.5" y="404" fill="#ABABAB" font-size="13.5" text-anchor="middle">HSL, HSB, OKLCH</text><rect x="52" y="468" width="195" height="128" rx="8" fill="#262626" stroke="#ABABAB" stroke-dasharray="6 5"/><text x="149.5" y="513" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">Can text on it</text><text x="149.5" y="534" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">be read?</text><text x="149.5" y="562" fill="#ABABAB" font-size="13.5" text-anchor="middle">luminance and contrast</text><rect x="492" y="468" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="589.5" y="504" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">The display turns it</text><text x="589.5" y="525" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">back into light</text><text x="589.5" y="553" fill="#ABABAB" font-size="13.5" text-anchor="middle">decodes, then drives</text><text x="589.5" y="571" fill="#ABABAB" font-size="13.5" text-anchor="middle">the subpixels</text><circle cx="494" cy="470" r="12" fill="#F2F2F2"/><text x="494" y="475" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">7</text><rect x="712" y="468" width="195" height="128" rx="8" fill="#262626" stroke="#5A5A5A"/><text x="809.5" y="504" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">You see the</text><text x="809.5" y="525" fill="#F2F2F2" font-size="16" font-weight="700" text-anchor="middle">same color</text><text x="809.5" y="553" fill="#ABABAB" font-size="13.5" text-anchor="middle">new light, same three</text><text x="809.5" y="571" fill="#ABABAB" font-size="13.5" text-anchor="middle">cone signals: a metamer</text><circle cx="714" cy="470" r="12" fill="#F2F2F2"/><text x="714" y="475" fill="#181818" font-size="14" font-weight="700" text-anchor="middle">8</text><path d="M247 216H271" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M467 216H491" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M589.5 280V295H149.5V309" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M247 374H271" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M467 374H491" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M687 374H711" fill="none" stroke="#ABABAB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><path d="M149.5 438V467" fill="none" stroke="#ABABAB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><path d="M589.5 438V467" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/><path d="M687 532H711" fill="none" stroke="#F2F2F2" stroke-width="2" marker-end="url(#ai)"/></svg>