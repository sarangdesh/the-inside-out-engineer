 <title>metamerism spectrum example</title>
 <desc>Illustration of colour metamerism by CMG Lee. In column 1, a ball is illuminated by monochromatic light. Multiplying the spectrum by the cones' spectral sensitivity curves gives the response for each cone type. In column 2, metamerism is used to simulate the scene with blue, green and red LEDs, giving a similar response. Curves are from http://commons.wikimedia.org/wiki/File:Cones_SMJ2_E.svg .</desc>
 <style type="text/css">
.main { font-family:Helvetica,Arial,sans-serif; font-size:40px; text-anchor:middle; fill:#000000; stroke:#000000; stroke-width:2; }
text  { stroke:none; }
.big  { font-size:60px; }
.s    { stroke:#0000ff; }
.m    { stroke:#009900; }
.l    { stroke:#cc0000; }
 </style>
